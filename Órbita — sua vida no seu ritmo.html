      <div class="sidebar-bottom">
        <div class="gentle-note"><span>☾</span><p>Um passo de cada vez também é caminho.</p></div>
        <div class="local-status"><i></i> Seus dados ficam neste dispositivo</div>
      </div>
    </aside>
    <div class="mobile-scrim" id="scrim"></div>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
        <div class="breadcrumb"><span>MEU ESPAÇO</span><b>/</b><strong id="crumb">Visão geral</strong></div>
        <div class="top-actions">
          <div class="today-pill"><span class="today-dot"></span><span id="todayText"></span></div>
          <div class="more-wrap">
            <button class="icon-button more-button" id="moreButton" aria-label="Mais opções" aria-expanded="false" aria-haspopup="true">···</button>
            <div class="more-menu" id="moreMenu" role="menu" hidden>
              <button data-action="export" role="menuitem">⇩ <span>Baixar meus dados</span></button>
              <button data-action="import" role="menuitem">⇧ <span>Importar dados salvos</span></button>
              <button data-action="privacy" role="menuitem">♡ <span>Como os dados são usados</span></button>
              <div class="menu-divider"></div>
              <button class="danger-item" data-action="clear" role="menuitem">⌫ <span>Apagar todos os dados</span></button>
            </div>
          </div>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </header>
      <div class="page-wrap" id="pageContent" aria-live="polite"></div>
      <footer class="footer-note">Feito para apoiar você, sem pressa e sem comparação. <span>✦</span></footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close icon-button" data-action="close-modal" aria-label="Fechar">×</button>
      <div id="modalBody"></div>
    </section>
  </div>
  <script>
(() => {
  'use strict';
  const STORAGE_KEY='orbita-personal-v1';
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const uid=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
  const defaults=()=>({version:1,prefs:{waterGoal:3500,readGoal:20,socialLimit:120},days:{},tasks:[],transactions:[],xp:0,xpEvents:{},chat:[]});
  let state=load();
  let activePage='inicio';
  let editing=null;
  const $=(s,root=document)=>root.querySelector(s);
  const $$=(s,root=document)=>[...root.querySelectorAll(s)];
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dayData=(key=today())=>state.days[key]||(state.days[key]={waterMl:0,readPages:0,socialMin:0,meals:[]});
  function load(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));return parsed&&parsed.version===1?{...defaults(),...parsed,prefs:{...defaults().prefs,...parsed.prefs},days:parsed.days||{},tasks:parsed.tasks||[],transactions:parsed.transactions||[],xpEvents:parsed.xpEvents||{},chat:parsed.chat||[]}:defaults()}catch{return defaults()}}
  function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
  const levels=[['Semente',0],['Faísca',80],['Brasa',190],['Aurora',340],['Prisma',540],['Eclipse',800],['Constelação',1120],['Lenda Lunar',1500]];
  const currentLevel=()=>{let i=levels.length-1;for(let n=0;n<levels.length;n++){if(state.xp<levels[n][1]){i=Math.max(0,n-1);break}}return i};
  const xpNext=()=>{const i=currentLevel();return {index:i,name:levels[i][0],min:levels[i][1],next:levels[i+1]?.[1]??null}};
  function award(key,points,reason){if(state.xpEvents[key])return false;const before=currentLevel();state.xpEvents[key]=true;state.xp+=points;save();const level=xpNext();toast(`+${points} pontos — ${reason} ✦`, 'success');if(level.index>before)toast(`Nova patente: ${level.name}! Seu cuidado está florescendo.`, 'success');return true}
  function toast(message,type=''){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;$('#toastRegion').append(el);setTimeout(()=>el.remove(),3300)}
  const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
  const dateLabel=(d=today(),opts={weekday:'long',day:'numeric',month:'long'})=>new Date(`${d}T12:00:00`).toLocaleDateString('pt-BR',opts);
  const dayShort=d=>new Date(`${d}T12:00:00`).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
  const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
  const tasksToday=()=>state.tasks.filter(t=>t.doneDates?.[today()]);
  const doneCount=()=>tasksToday().length;
  const waterPct=(d=dayData())=>state.prefs.waterGoal?clamp(d.waterMl/state.prefs.waterGoal*100,0,100):0;
  const readPct=(d=dayData())=>state.prefs.readGoal?clamp(d.readPages/state.prefs.readGoal*100,0,100):0;
  const finance=()=>state.transactions.reduce((a,t)=>a+(t.type==='entrada'?Number(t.amount):-Number(t.amount)),0);
  function checkAwards(){const d=dayData();if(d.waterMl>=state.prefs.waterGoal)award(`water:${today()}`,15,'meta de água');if(d.readPages>=state.prefs.readGoal)award(`read:${today()}`,20,'meta de leitura')}
  const navLabels={inicio:'Visão geral',rotina:'Rotina',agua:'Água',alimentacao:'Alimentação',leitura:'Leitura',redes:'Redes sociais',financas:'Finanças',apoio:'Espaço de apoio',progresso:'Meu progresso'};
  function setPage(name){if(!navLabels[name])return;activePage=name;editing=null;$('.breadcrumb strong').textContent=navLabels[name];$$('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.page===name));render();closeMenu()}
  function render(){const root=$('#pageContent');const renderers={inicio:renderHome,rotina:renderRoutine,agua:renderWater,alimentacao:renderMeals,leitura:renderReading,redes:renderSocial,financas:renderFinance,apoio:renderSupport,progresso:renderProgress};root.innerHTML=renderers[activePage]();bindLocal();}
  function rankWidget(){const r=xpNext(),pct=r.next?clamp((state.xp-r.min)/(r.next-r.min)*100,0,100):100;return `<div class="hero-rank"><div class="rank-line"><div><div class="xp-label">SUA PATENTE</div><div class="rank-name">${r.name}</div></div><span class="rank-mark">✧</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="rank-foot"><span>${state.xp} pts</span><span>${r.next?`${r.next-state.xp} pts para a próxima`:'nível máximo ✦'}</span></div></div>`}
  function pageHeading(eyebrow,title,desc,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`}
  function metric(label,value,foot,icon,tone,page){return `<button class="card metric-card metric-link" data-goto="${page}" style="--tone:${tone};--orb:${tone}20"><div class="metric-head"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></button>`}
  function homeTaskRows(limit=5){const list=[...state.tasks].sort((a,b)=>(a.time||'').localeCompare(b.time||''));if(!list.length)return `<div class="empty-state"><div class="empty-illustration">☼</div><p>Sua rotina pode começar com uma tarefa pequena.</p><button class="btn btn-ghost btn-small" data-goto="rotina">Criar minha primeira tarefa</button></div>`;return `<div class="task-list">${list.slice(0,limit).map(taskRow).join('')}</div>${list.length>limit?`<button class="btn btn-ghost btn-small" data-goto="rotina" style="margin-top:10px">Ver todas as tarefas →</button>`:''}`}
  function taskRow(t){const done=!!t.doneDates?.[today()];return `<div class="task-row"><button class="check-box ${done?'checked':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${done?'Desmarcar':'Concluir'} ${escapeHtml(t.title)}">${done?'✓':''}</button><span class="task-label ${done?'done':''}">${escapeHtml(t.title)}</span><span class="task-time">${escapeHtml(t.time||'')}</span></div>`}
  function renderHome(){const d=dayData(),tasks=state.tasks.length;const water=waterPct(),read=readPct();const balance=finance();const remaining=Math.max(0,state.prefs.socialLimit-d.socialMin);return `<section class="dashboard-hero"><div class="hero-copy"><div class="eyebrow">${escapeHtml(dateLabel())} · SEU CANTINHO</div><h1>Oi! Vamos no seu ritmo. <span class="accent">✦</span></h1><p>Não precisa fazer tudo hoje. Escolha o próximo passo que faz sentido para você.</p></div>${rankWidget()}</section><div class="grid metric-grid">${metric('Rotina',`${doneCount()} / ${tasks}`,tasks?'tarefas concluídas hoje':'crie uma rotina leve','✓','#c4a8ff','rotina')}${metric('Água',`${(d.waterMl/1000).toFixed(1)} L`,`${Math.round(water)}% da meta escolhida`,'◌','#82c8f4','agua')}${metric('Leitura',`${d.readPages} pág.`,`${Math.round(read)}% da meta de hoje`,'Aa','#bca6ff','leitura')}${metric('Redes sociais',`${d.socialMin} min`,remaining?`${remaining} min até seu limite`:'limite diário alcançado','◷','#f3a9cc','redes')}</div><div class="grid overview-lower"><section class="card"><div class="card-title-row"><div><h2>O que está no seu dia</h2><p class="card-subtitle">Uma lista flexível, sem cobranças.</p></div><button class="btn btn-ghost btn-small" data-goto="rotina">+ Tarefa</button></div>${homeTaskRows()}</section><section class="card"><div class="card-title-row"><div><h2>Seu espaço financeiro</h2><p class="card-subtitle">Acompanhe entradas e gastos que registrar.</p></div><button class="btn btn-ghost btn-small" data-goto="financas">Abrir</button></div><div class="eyebrow" style="margin:20px 0 3px">SALDO REGISTRADO</div><div class="metric-value ${balance>=0?'positive':'negative'}" style="margin:0 0 8px">${money(balance)}</div><div class="tiny muted">${state.transactions.length?`${state.transactions.length} registros no total`:'Adicione uma entrada ou gasto quando quiser.'}</div><div style="margin-top:18px"><button class="btn btn-ghost btn-small" data-goto="progresso">Ver meu progresso →</button></div></section></div>`}
  function renderRoutine(){const sorted=[...state.tasks].sort((a,b)=>(a.time||'').localeCompare(b.time||''));const pct=state.tasks.length?Math.round(doneCount()/state.tasks.length*100):0;return `${pageHeading('PEQUENOS PASSOS','Rotina','Crie uma estrutura que combine com você. Para manter os pontos equilibrados, até 4 tarefas por dia dão experiência; as demais ainda contam no seu progresso.') }<div class="grid split-content"><section class="card"><div class="card-title-row"><div><h2>Hoje · ${escapeHtml(dateLabel(today(),{weekday:'short',day:'numeric',month:'short'}))}</h2><p class="card-subtitle">${doneCount()} de ${state.tasks.length} tarefas concluídas</p></div><span class="tag">${pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="record-list" style="margin-top:12px">${sorted.length?sorted.map(t=>`${taskRow(t)}<div class="row-actions" style="justify-content:flex-end;padding:0 0 8px 30px"><button class="icon-btn-sm" title="Editar" data-action="edit-task" data-id="${t.id}">✎</button><button class="icon-btn-sm" title="Apagar" data-action="delete-task" data-id="${t.id}">⌫</button></div>`).join(''):`<div class="empty-state"><div class="empty-illustration">☼</div><p>Você ainda não adicionou tarefas. Comece com algo simples, como separar a mochila ou fazer uma pausa.</p></div>`}</div></section><section class="card"><div class="card-title-row"><div><h2>${editing?.type==='task'?'Editar tarefa':'Adicionar uma tarefa'}</h2><p class="card-subtitle">Você pode mudar ou apagar quando quiser.</p></div></div><form id="taskForm" class="form-card"><div class="field"><label for="taskTitle">O que você quer fazer?</label><input id="taskTitle" name="title" required maxlength="90" placeholder="Ex.: organizar minha mesa" value="${escapeHtml(editing?.type==='task'?state.tasks.find(t=>t.id===editing.id)?.title||'':'')}"></div><div class="field" style="margin-top:11px"><label for="taskTime">Horário (opcional)</label><input id="taskTime" name="time" type="time" value="${escapeHtml(editing?.type==='task'?state.tasks.find(t=>t.id===editing.id)?.time||'':'')}"></div><div class="form-actions">${editing?.type==='task'?'<button class="btn btn-ghost" type="button" data-action="cancel-edit">Cancelar</button>':''}<button class="btn btn-primary" type="submit">${editing?.type==='task'?'Salvar alterações':'Adicionar tarefa'}</button></div></form></section></div>`}
  function renderWater(){const d=dayData(),pct=waterPct();return `${pageHeading('CUIDADO NO SEU RITMO','Água','Registre o que bebeu ao longo do dia e ajuste a meta para o que é adequado para você. A sugestão inicial de 3,5 L é configurável; não se force a beber além do que é confortável ou recomendado para você.')}<div class="grid split-content"><section class="card"><div class="card-title-row"><div><h2>Meu acompanhamento de hoje</h2><p class="card-subtitle">Se preferir, registre manualmente em mililitros.</p></div></div><div class="water-glass-wrap"><div><div class="water-glass" aria-label="Representação visual do registro de água"><div class="water-fill" style="height:${pct}%"></div></div></div></div><div class="water-stat"><strong>${(d.waterMl/1000).toFixed(2)} <span style="font-size:16px">L</span></strong><span>de ${(state.prefs.waterGoal/1000).toFixed(2)} L da sua meta escolhida</span><div class="water-progress"><div class="progress-fill" style="width:${pct}%"></div></div><span>${Math.round(pct)}% do objetivo — a meta pode ser ajustada a qualquer momento.</span><div class="quick-amounts"><button class="btn btn-ghost btn-small" data-water="150">+ 150 ml</button><button class="btn btn-ghost btn-small" data-water="250">+ 250 ml</button><button class="btn btn-ghost btn-small" data-water="350">+ 350 ml</button></div></div></section><section class="card section-stack"><div><h2>Personalize seu acompanhamento</h2><p class="card-subtitle">Cada corpo e cada dia são diferentes.</p></div><form id="waterForm" class="form-card"><div class="field"><label for="waterAmount">Registrar quantidade (ml)</label><input id="waterAmount" type="number" name="amount" min="1" max="5000" step="1" placeholder="Ex.: 200" required></div><div class="form-actions"><button class="btn btn-primary" type="submit">Registrar água</button></div></form><form id="waterGoalForm" class="form-card"><div class="field"><label for="waterGoal">Minha meta diária (ml)</label><input id="waterGoal" type="number" name="goal" min="250" max="10000" step="50" value="${state.prefs.waterGoal}" required></div><div class="form-actions"><button class="btn btn-ghost" type="submit">Salvar meta</button></div></form></section></div>`}
  function renderMeals(){const d=dayData(),meals=[...(d.meals||[])].sort((a,b)=>a.time.localeCompare(b.time));return `${pageHeading('BEM-ESTAR, SEM PRESSÃO','Alimentação','Use este espaço para lembrar das refeições e horários que você escolher. Sem contagem de calorias, dietas restritivas ou culpa.')}<div class="grid split-content"><section class="card"><div class="card-title-row"><div><h2>Registros de hoje</h2><p class="card-subtitle">${meals.length?`${meals.length} ${meals.length===1?'registro':'registros'} — sua organização, do seu jeito.`:'Você pode registrar refeições quando quiser.'}</p></div><span class="tag">${escapeHtml(dateLabel(today(),{day:'numeric',month:'short'}))}</span></div><div class="record-list">${meals.length?meals.map(m=>`<div class="record-row"><span class="meal-time">${escapeHtml(m.time)}</span><div class="record-main"><strong>${escapeHtml(m.name)}</strong><span>${escapeHtml(m.note||'Registro pessoal')}</span></div><div class="row-actions"><button class="icon-btn-sm" title="Editar" data-action="edit-meal" data-id="${m.id}">✎</button><button class="icon-btn-sm" title="Apagar" data-action="delete-meal" data-id="${m.id}">⌫</button></div></div>`).join(''):`<div class="empty-state"><div class="empty-illustration">✿</div><p>Nenhuma refeição registrada ainda. Adicione uma refeição sem se preocupar com quantidades ou julgamentos.</p></div>`}</div></section><section class="card"><div><h2>${editing?.type==='meal'?'Editar registro':'Adicionar refeição'}</h2><p class="card-subtitle">Registre apenas o que for útil para você.</p></div><form id="mealForm" class="form-card" style="margin-top:15px"><div class="field"><label for="mealName">Refeição ou lanche</label><input id="mealName" name="name" required maxlength="90" placeholder="Ex.: café da manhã" value="${escapeHtml(editing?.type==='meal'?dayData().meals.find(m=>m.id===editing.id)?.name||'':'')}"></div><div class="form-row" style="margin-top:11px"><div class="field"><label for="mealTime">Horário</label><input id="mealTime" name="time" type="time" value="${escapeHtml(editing?.type==='meal'?dayData().meals.find(m=>m.id===editing.id)?.time||'12:00':'12:00')}"></div><div class="field"><label for="mealNote">Nota opcional</label><input id="mealNote" name="note" maxlength="100" placeholder="Se quiser"></div></div><div class="form-actions">${editing?.type==='meal'?'<button class="btn btn-ghost" type="button" data-action="cancel-edit">Cancelar</button>':''}<button class="btn btn-primary" type="submit">${editing?.type==='meal'?'Salvar alterações':'Adicionar registro'}</button></div></form></section></div>`}
  function renderReading(){const d=dayData(),pct=readPct(),week=weekDates(),weekTotal=week.reduce((sum,k)=>sum+(state.days[k]?.readPages||0),0);return `${pageHeading('UM POUCO DE CADA VEZ','Leitura','Escolha uma meta confortável, anote suas páginas e acompanhe seu próprio ritmo.')}<div class="grid split-content"><section class="card"><div class="card-title-row"><div><h2>Meu dia de leitura</h2><p class="card-subtitle">Cada página conta, mesmo que hoje você leia menos.</p></div></div><div style="text-align:center;padding:18px 10px 23px"><div class="reading-big">${d.readPages}<span class="muted" style="font-size:17px;font-weight:500"> pág.</span></div><div class="tiny muted">de ${state.prefs.readGoal} páginas na sua meta diária</div><div class="progress-track" style="max-width:370px;margin:15px auto 6px"><div class="progress-fill" style="width:${pct}%"></div></div><div class="tiny soft">${Math.round(pct)}% do que você planejou</div><div class="tag" style="margin-top:18px">✦ ${weekTotal} páginas nesta semana</div></div><div class="quick-amounts"><button class="btn btn-ghost btn-small" data-read="1">+ 1 pág.</button><button class="btn btn-ghost btn-small" data-read="5">+ 5 pág.</button><button class="btn btn-ghost btn-small" data-read="10">+ 10 pág.</button></div></section><section class="card section-stack"><div><h2>Atualize seu registro</h2><p class="card-subtitle">Você controla o que registrar.</p></div><form id="readForm" class="form-card"><div class="field"><label for="readPages">Páginas lidas hoje</label><input id="readPages" type="number" name="pages" min="1" max="5000" required placeholder="Ex.: 12"></div><div class="form-actions"><button class="btn btn-primary">Somar páginas</button></div></form><form id="readGoalForm" class="form-card"><div class="field"><label for="readGoal">Minha meta de páginas por dia</label><input id="readGoal" type="number" name="goal" min="1" max="1000" value="${state.prefs.readGoal}" required></div><div class="form-actions"><button class="btn btn-ghost">Salvar meta</button></div></form></section></div>`}
  function renderSocial(){const d=dayData(),limit=state.prefs.socialLimit,pct=limit?clamp(d.socialMin/limit*100,0,100):100,under=d.socialMin<=limit;return `${pageHeading('ESCOLHAS CONSCIENTES','Redes sociais','Registre manualmente o tempo que você usou. O site não monitora seu celular; esta é uma ferramenta de reflexão, sem julgamento.')}<div class="grid split-content"><section class="card"><div class="card-title-row"><div><h2>Meu registro de hoje</h2><p class="card-subtitle">Seu uso é uma informação, não uma nota sobre você.</p></div><span class="tag">${under?'No seu limite':'Acima do limite'}</span></div><div style="text-align:center;padding:21px 10px"><div class="social-clock">${formatMinutes(d.socialMin)}</div><div class="tiny muted">de ${formatMinutes(limit)} no limite que você escolheu</div><div class="progress-track" style="max-width:370px;margin:15px auto 6px"><div class="progress-fill" style="width:${pct}%;background:${under?'linear-gradient(90deg,#bb9cf7,#8e6fe0)':'linear-gradient(90deg,#e9a2ad,#cc667d)'}"></div></div><div class="tiny soft">${under?`${Math.max(0,limit-d.socialMin)} min restantes`:`${d.socialMin-limit} min acima do limite`}</div></div><form id="socialForm" class="form-card"><div class="field"><label for="socialMinutes">Somar tempo usado hoje (minutos)</label><input id="socialMinutes" type="number" name="minutes" min="1" max="1440" required placeholder="Ex.: 15"></div><div class="form-actions"><button class="btn btn-primary">Registrar tempo</button></div></form></section><section class="card section-stack"><div><h2>Defina um limite gentil</h2><p class="card-subtitle">Um limite serve para ajudar, não para punir.</p></div><form id="socialGoalForm" class="form-card"><div class="field"><label for="socialLimit">Meu limite diário (minutos)</label><input id="socialLimit" type="number" name="limit" min="1" max="1440" value="${limit}" required></div><div class="form-actions"><button class="btn btn-ghost">Salvar limite</button></div></form><div class="support-banner" style="margin:0"><strong>Lembrete:</strong> este registro é manual. Para consultar o uso do aparelho, use as configurações de tempo de tela do próprio dispositivo.</div></section></div>`}
  function renderFinance(){const entries=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date));const income=state.transactions.filter(t=>t.type==='entrada').reduce((a,t)=>a+Number(t.amount),0),out=state.transactions.filter(t=>t.type==='saida').reduce((a,t)=>a+Number(t.amount),0),bal=income-out;return `${pageHeading('CLAREZA, UM REGISTRO DE CADA VEZ','Finanças','Anote entradas e gastos para entender seu saldo. Você pode editar ou apagar qualquer registro.',`<button class="btn btn-primary" data-action="focus-transaction">+ Novo registro</button>`)}<div class="grid finance-summary"><div class="card finance-stat"><span>Total de entradas</span><strong class="positive">${money(income)}</strong></div><div class="card finance-stat"><span>Total de gastos</span><strong class="negative">${money(out)}</strong></div><div class="card finance-stat finance-total"><span>Saldo ${bal>=0?'positivo':'negativo'}</span><strong class="${bal>=0?'positive':'negative'}">${money(bal)}</strong></div></div><div class="grid split-content"><section class="card list-card"><div class="card-title-row"><div><h2>Movimentações</h2><p class="card-subtitle">${entries.length?`${entries.length} registros salvos`:'Seu histórico aparece aqui.'}</p></div></div><div class="record-list">${entries.length?entries.map(t=>`<div class="record-row"><span class="record-symbol" style="${t.type==='saida'?'color:#f3a4ae;background:#35232b':''}">${t.type==='entrada'?'↙':'↗'}</span><div class="record-main"><strong>${escapeHtml(t.description)}</strong><span>${escapeHtml(formatDate(t.date))} · ${t.type==='entrada'?'Entrada':'Gasto'}</span></div><div class="record-value ${t.type==='entrada'?'positive':'negative'}">${t.type==='entrada'?'+':'−'}${money(t.amount)}</div><div class="row-actions"><button class="icon-btn-sm" title="Editar" data-action="edit-transaction" data-id="${t.id}">✎</button><button class="icon-btn-sm" title="Apagar" data-action="delete-transaction" data-id="${t.id}">⌫</button></div></div>`).join(''):`<div class="empty-state"><div class="empty-illustration">↗</div><p>Ainda não há movimentações. Adicione uma entrada ou gasto para começar seu acompanhamento.</p></div>`}</div></section><section class="card" id="transactionPanel"><div><h2>${editing?.type==='transaction'?'Editar registro':'Novo registro'}</h2><p class="card-subtitle">O saldo é calculado com as datas e valores salvos.</p></div><form id="transactionForm" class="form-card" style="margin-top:15px"><div class="field"><label for="transactionDescription">Descrição</label><input id="transactionDescription" name="description" required maxlength="90" placeholder="Ex.: mesada, transporte" value="${escapeHtml(editing?.type==='transaction'?state.transactions.find(t=>t.id===editing.id)?.description||'':'')}"></div><div class="form-row" style="margin-top:11px"><div class="field"><label for="transactionType">Tipo</label><select id="transactionType" name="type"><option value="entrada" ${editing?.type==='transaction'&&state.transactions.find(t=>t.id===editing.id)?.type==='entrada'?'selected':''}>Entrada</option><option value="saida" ${editing?.type==='transaction'&&state.transactions.find(t=>t.id===editing.id)?.type==='saida'?'selected':''}>Gasto</option></select></div><div class="field"><label for="transactionAmount">Valor (R$)</label><input id="transactionAmount" type="number" name="amount" step="0.01" min="0.01" required placeholder="0,00" value="${editing?.type==='transaction'?state.transactions.find(t=>t.id===editing.id)?.amount||'':''}"></div></div><div class="field" style="margin-top:11px"><label for="transactionDate">Data</label><input id="transactionDate" type="date" name="date" value="${editing?.type==='transaction'?state.transactions.find(t=>t.id===editing.id)?.date||today():today()}" required></div><div class="form-actions">${editing?.type==='transaction'?'<button class="btn btn-ghost" type="button" data-action="cancel-edit">Cancelar</button>':''}<button class="btn btn-primary">${editing?.type==='transac   function renderSupport(){const initial={role:'assistant',text:'Oi. Este é um espaço para colocar os pensamentos em ordem, sem precisar explicar tudo de uma vez. O que está passando pela sua cabeça agora?'};const messages=state.chat.length?state.chat:[initial];return `${pageHeading('VOCÊ NÃO PRECISA ORGANIZAR TUDO SÓ','Espaço de apoio','Uma pausa para falar, respirar e escolher um próximo passo pequeno. Você merece apoio de pessoas de confiança também.')}<div class="support-banner"><strong>Um espaço de apoio local, não uma IA conectada.</strong> As respostas deste protótipo seguem orientações simples e ficam salvas neste dispositivo. Para ativar uma IA de verdade, é preciso conectar um servidor seguro com uma chave de IA; nunca coloque essa chave no navegador. Isto não substitui psicólogo, diagnóstico ou atendimento profissional, e não é um canal de emergência. Evite escrever dados muito pessoais. Não posso prometer sigilo absoluto: quem tiver acesso a este dispositivo ou aos arquivos do site poderá ver os registros.</div><section class="card"><div class="card-title-row"><div><h2>Conversa de hoje</h2><p class="card-subtitle">Você pode apagar o histórico quando quiser pelo menu ⋯.</p></div><button class="btn btn-ghost btn-small" data-action="clear-chat">Apagar conversa</button></div><div class="chat-box" id="chatBox">${messages.map(chatBubble).join('')}</div><div class="chat-starters"><button class="starter" data-chat="Me ajuda a organizar meus pensamentos">Me ajuda a organizar</button><button class="starter" data-chat="Quero fazer uma pausa">Fazer uma pausa</button><button class="starter" data-chat="Quero dar um primeiro passo pequeno">Um passo pequeno</button></div><form id="chatForm" class="chat-form"><input id="chatInput" name="message" maxlength="700" autocomplete="off" placeholder="Escreva o que quiser compartilhar…" aria-label="Sua mensagem"><button class="btn btn-primary">Enviar</button></form><p class="tiny muted" style="margin:11px 1px 0">Se você estiver e   function responseFor(text){const low=text.toLowerCase();if(/me machucar|me ferir|tirar minha vida|me matar|suic[ií]d|quero morrer|estou em perigo|em perigo/.test(low))return 'Sinto muito que você esteja passando por isso. Por favor, procure agora um adulto de confiança e diga com clareza que você precisa de ajuda imediata. Vá para perto dessa pessoa e não fique sozinho. Se o perigo for imediato, peça que ela acione a emergência local agora. Esta conversa não consegue oferecer ajuda de emergência.';if(/respir|pausa|ansios|p[aâ]nic|nervos/.test(low))return 'Podemos fazer uma pausa curta, se isso parecer confortável: apoie os pés no chão, solte os ombros e perceba três coisas que você vê. Não precisa mudar sua respiração. Depois, escolha se quer continuar conversando ou chamar alguém de confiança.';if(/organizar|pensamento|confus|por onde|muita coisa/.test(low))return 'Vamos por partes. Se quiser, escreva só uma coisa que está pesando mais agora. Depois podemos separar o que precisa de atenção hoje e o que pode esperar. Não precisa resolver tudo de uma vez.';if(/passo|come[cç]|fazer agora|n[aã]o consigo/.test(low))return 'Tudo bem começar bem pequeno. Talvez beber um pouco de água, abrir a janela, alongar por um minuto ou mandar uma mensagem para alguém seguro. Qual dessas coisas parece mais possível agora? Você também pode escolher outra.';if(/sozinh|ningu[eé]m|trist|dif[ií]cil|mal|cansad/.test(low))return 'Obrigado por compartilhar isso comigo. Você não precisa se julgar por se sentir assim. Tem alguém de confiança — um familiar, responsável, professor ou orientador — com quem você possa conversar hoje? Posso ajudar a pensar em como começar.';return 'Entendi. Obrigado por dividir isso. O que você mais gostaria que alguém compreendesse sobre essa situação? Se preferir, também podemos pensar em uma pausa ou em uma ação pequena para este momento.'}
  function renderProgress(){const dates=weekDates(),days=dates.map(k=>state.days[k]||{waterMl:0,readPages:0,socialMin:0});const maxWater=Math.max(state.prefs.waterGoal,...days.map(d=>d.waterMl),1),maxRead=Math.max(state.prefs.readGoal,...days.map(d=>d.readPages),1);const weekTotal=days.reduce((s,d)=>s+d.readPages,0);const rank=xpNext();return `${pageHeading('SEU CAMINHO É SEU','Meu progresso','Um retrato do que você registrou — só para acompanhar você mesma(o), sem comparação com outras pessoas.')}<div class="grid metric-grid">${metric('Pontos de experiência',state.xp,'nenhum ponto é retirado em dias difíceis','✧','#c4a8ff','progresso')}${metric('Leitura nesta semana',`${weekTotal} pág.`,'seu total registrado nos últimos 7 dias','Aa','#c4a8ff','leitura')}${metric('Rotina hoje',`${doneCount()} / ${state.tasks.length}`,'tarefas marcadas para hoje','✓','#a6e3c5','rotina')}${metric('Saldo registrado',money(finance()),finance()>=0?'saldo atual positivo':'saldo atual negativo','↗','#82c8f4','financas')}</div><div class="grid overview-lower"><section class="card chart-card"><div class="card-title-row"><div><h2>Últimos 7 dias</h2><p class="card-subtitle">Água e leitura que você registrou.</p></div><div class="chart-legend"><span><i class="legend-dot"></i>Água</span><span><i class="legend-dot" style="background:var(--green)"></i>Leitura</span></div></div><div class="bar-chart">${dates.map((k,i)=>{const w=days[i].waterMl,r=days[i].readPages;return `<div class="bar-column"><div class="bar-val">${r} pág.</div><div class="bar-pair"><div class="bar" title="${(w/1000).toFixed(2)} L" style="height:${clamp(w/maxWater*100,3,100)}%"></div><div class="bar alt" title="${r} páginas" style="height:${clamp(r/maxRead*100,3,100)}%"></div></div><div class="bar-day">${dayShort(k)}</div></div>`}).join('')}</div></section><section class="card"><div class="card-title-row"><div><h2>Seu próximo marco</h2><p class="card-subtitle">Uma patente construída com escolhas suas.</p></div></div><div class="rank-line"><strong class="rank-name">${rank.name}</strong><span class="tag">${state.xp} pts</span></div><div class="progress-track"><div class="progress-fill" style="width:${rank.next?clamp((state.xp-rank.min)/(rank.next-rank.min)*100,0,100):100}%"></div></div><div class="rank-foot"><span>Atual</span><span>${rank.next?`${rank.next-state.xp} pontos até ${levels[rank.index+1][0]}`:'Você chegou ao topo ✦'}</span></div><p class="tiny muted" style="margin:14px 0 0">Complete metas escolhidas por você para ganhar pontos. Cada conquista diária conta uma vez; pontos não são retirados.</p></section></div><section class="card" style="margin-top:15px"><div class="card-title-row"><div><h2>Histórico dos últimos 7 dias</h2><p class="card-subtitle">Somente informações registradas por você.</p></div></div><div class="history-row" style="border-bottom-color:#423b49"><span class="history-date">Dia</span><span class="history-item">Água</span><span class="history-item">Leitura</span><span class="history-item">Rotina</span></div>${dates.map((k,i)=>{const d=state.days[k]||{};const count=(state.tasks.filter(t=>t.doneDates?.[k]).length);return `<div class="history-row"><span class="history-date">${escapeHtml(dateLabel(k,{weekday:'short',day:'numeric',month:'short'}))}</span><span class="history-item">${((d.waterMl||0)/1000).toFixed(1)} L</span><span class="history-item">${d.readPages||0} pág.</span><span class="history-item">${count} ${count===1?'tarefa':'tarefas'}</span></div>`}).join('')}</section><section class="card" style="margin-top:15px"><div class="card-title-row"><div><h2>Trilha de patentes</h2><p class="card-subtitle">Sua identidade e seus marcos, no seu tempo.</p></div></div><div class="rank-grid">${levels.map(([name,points],i)=>`<div class="rank-card ${state.xp>=points?'unlocked':''} ${i===rank.index?'current':''}"><strong>✧ ${name}</strong><span>${points} pontos${i===rank.index?' · atual':''}</span></div>`).join('')}</div></section>`}
  function weekDates(){const now=new Date(`${today()}T12:00:00`),dates=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);dates.push(d.toLocaleDateString('en-CA'))}return dates}

  function bindLocal(){const chat=$('#chatBox');if(chat)chat.scrollTop=chat.scrollHeight;const host=$('#pageContent .card.section-stack'),d=dayData();if(!host)return;if(activePage==='agua')host.insertAdjacentHTML('beforeend',`<form id="waterEditForm" class="form-card"><div class="field"><label for="waterTotal">Corrigir o total de água de hoje (ml)</label><input id="waterTotal" type="number" name="total" min="0" max="20000" value="${d.waterMl}" required></div><div class="form-actions"><button class="btn btn-ghost">Salvar correção</button></div></form><button class="btn btn-ghost btn-small" data-action="reset-water" ${d.waterMl?'':'disabled'}>Apagar o registro de água de hoje</button>`);if(activePage==='leitura')host.insertAdjacentHTML('beforeend',`<form id="readEditForm" class="form-card"><div class="field"><label for="readTotal">Corrigir o total de páginas de hoje</label><input id="readTotal" type="number" name="total" min="0" max="5000" value="${d.readPages}" required></div><div class="form-actions"><button class="btn btn-ghost">Salvar correção</button></div></form><button class="btn btn-ghost btn-small" data-action="reset-read" ${d.readPages?'':'disabled'}>Apagar registro de hoje</button>`);if(activePage==='redes')host.insertAdjacentHTML('beforeend',`<form id="socialEditForm" class="form-card"><div class="field"><label for="socialTotal">Corrigir o total de minutos de hoje</label><input id="socialTotal" type="number" name="total" min="0" max="1440" value="${d.socialMin}" required></div><div class="form-actions"><button class="btn btn-ghost">Salvar correção</button></div></form><button class="btn btn-ghost btn-small" data-action="reset-social" ${d.socialMin?'':'disabled'}>Apagar registro de hoje</button><div class="form-card"><p class="tiny muted" style="margin:0 0 10px">${d.socialChecked?'Você já marcou esta meta como concluída hoje.':d.socialMin<=state.prefs.socialLimit?'Se o registro está certo e você ficou dentro do limite, pode reconhecer esse cuidado.':'Seu registro passou do limite. Não há punição; amanhã é uma nova chance.'}</p><button class="btn btn-ghost btn-small" data-action="complete-social" ${d.socialChecked||d.socialMin>state.prefs.socialLimit?'disabled':''}>${d.socialChecked?'Meta marcada hoje':'Marcar meta de hoje como concluída'}</button></div>`)}
  function closeMenu(){const side=$('#sidebar');side.classList.remove('open');$('#scrim').classList.remove('show');$('#menuToggle').setAttribute('aria-expanded','false')}

    const read=e.target.closest('[data-read]');if(read){dayData().readPages+=Number(read.dataset.read);checkAwards();save();render();toast('Leitura registrada. Cada página conta.','success');return}

  function handleAction(action,id){
    if(action==='export'){exportData();closeMore()}
    else if(action==='import'){$('#importFile').click();closeMore()}
    else if(action==='privacy'){closeMore();openModal('<div class="eyebrow">SEUS DADOS</div><h2>O que fica salvo?</h2><p>Suas tarefas, registros, configurações e conversa de apoio ficam no armazenamento local deste navegador, neste dispositivo. O site não envia esses dados para um servidor. Qualquer pessoa com acesso ao seu perfil do navegador ou aos arquivos pode conseguir vê-los.</p><p>Você pode baixar uma cópia pelo menu, importar um arquivo anterior ou apagar tudo. Use a conversa de apoio sem incluir dados muito pessoais.</p><div class="form-actions"><button class="btn btn-primary" data-action="close-modal">Entendi</button></div>')}
    else if(action==='clear'){closeMore();if(confirm('Apagar todos os registros, metas e a conversa deste dispositivo? Esta ação não pode ser desfeita.')){state=defaults();save();render();toast('Dados apagados. Você pode recomeçar quando quiser.')}}
    else if(action==='focus-transaction'){$('#transactionDescription')?.focus();$('#transactionPanel')?.scrollIntoView({behavior:'smooth',block:'center'})}
    else if(action==='toggle-task'){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.doneDates=t.doneDates||{};if(t.doneDates[today()])delete t.doneDates[today()];else{t.doneDates[today()]=true;const key=`task:${today()}:${t.id}`,earned=Object.keys(state.xpEvents).filter(k=>k.startsWith(`task:${today()}:`)).length;if(!state.xpEvents[key]){if(earned<4)award(key,10,'tarefa concluída');else toast('Você já ganhou pontos por 4 tarefas hoje. As outras continuam contando no seu progresso.')}}save();render()}
    else if(action==='edit-task'){editing={type:'task',id};render();$('#taskTitle')?.focus()}
    else if(action==='delete-task'){if(confirm('Apagar esta tarefa e seu histórico de conclusão?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render();toast('Tarefa apagada.')}}
    else if(action==='edit-meal'){editing={type:'meal',id};render();$('#mealName')?.focus()}
    else if(action==='delete-meal'){if(confirm('Apagar este registro de refeição?')){dayData().meals=dayData().meals.filter(m=>m.id!==id);save();render();toast('Registro apagado.')}}
    else if(action==='edit-transaction'){editing={type:'transaction',id};render();$('#transactionDescription')?.focus()}
    else if(action==='delete-transaction'){if(confirm('Apagar este registro financeiro?')){state.transactions=state.transactions.filter(t=>t.id!==id);save();render();toast('Registro apagado.')}}
    else if(action==='cancel-edit'){editing=null;render()}
    else if(action==='clear-chat'){if(confirm('Apagar todas as mensagens desta conversa?')){state.chat=[];save();render();toast('Conversa apagada.')}}
    else if(action==='complete-social'){const d=dayData();if(d.socialChecked)return;if(d.socialMin>state.prefs.socialLimit){toast('Sem problema: não há punição. Amanhã você pode tentar de novo.');return}d.socialChecked=true;award(`social:${today()}`,15,'meta de redes sociais');save();render()}
    else if(action==='reset-water'){dayData().waterMl=0;save();render();toast('Registro de água de hoje apagado.')}
    else if(action==='reset-read'){dayData().readPages=0;save();render();toast('Registro de leitura de hoje apagado.')}
    else if(action==='reset-social'){dayData().socialMin=0;dayData().socialChecked=false;save();render();toast('Registro de redes sociais de hoje apagado.')}
    else if(action==='close-modal')closeModal();
  }
  function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`orbita-dados-${today()}.json`;a.click();URL.revokeObjectURL(url);toast('Uma cópia dos seus dados foi preparada.','success')}
  $('#importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||obj.version!==1||!obj.prefs||!obj.days||!Array.isArray(obj.tasks)||!Array.isArray(obj.transactions))throw new Error('Formato inválido');if(!confirm('Substituir os dados atuais pelos dados deste arquivo?'))return;state={...defaults(),...obj,prefs:{...defaults().prefs,...obj.prefs},xpEvents:obj.xpEvents||{},chat:Array.isArray(obj.chat)?obj.chat:[]};save();render();toast('Dados importados com sucesso.','success')}catch{toast('Não consegui ler esse arquivo. Use uma cópia JSON baixada pelo menu.','warning')}finally{e.target.value=''}});

  render=function(){originalRender();wireForms()};
  function wireForms(){
    const tf=$('#taskForm');if(tf)submitForm(tf,f=>{const data={title:f.get('title').trim(),time:f.get('time')};if(editing?.type==='task'){const t=state.tasks.find(x=>x.id===editing.id);if(t)Object.assign(t,data)}else state.tasks.push({id:uid(),...data,doneDates:{}});editing=null;save();render();toast('Tarefa salva. Um passo de cada vez.','success')});
    const wf=$('#waterForm');if(wf)submitForm(wf,f=>{dayData().waterMl+=Number(f.get('amount'));checkAwards();save();render();toast('Água registrada.','success')});
    const wgf=$('#waterGoalForm');if(wgf)submitForm(wgf,f=>{state.prefs.waterGoal=Number(f.get('goal'));checkAwards();save();render();toast('Sua meta de água foi atualizada.','success')});
    const wef=$('#waterEditForm');if(wef)submitForm(wef,f=>{dayData().waterMl=Number(f.get('total'));checkAwards();save();render();toast('Total de água corrigido.','success')});
    const mf=$('#mealForm');if(mf)submitForm(mf,f=>{const meal={name:f.get('name').trim(),time:f.get('time')||'12:00',note:f.get('note').trim()};const meals=dayData().meals;if(editing?.type==='meal'){const m=meals.find(x=>x.id===editing.id);if(m)Object.assign(m,meal)}else meals.push({id:uid(),...meal});editing=null;save();render();toast('Refeição registrada.','success')});
    const rf=$('#readForm');if(rf)submitForm(rf,f=>{dayData().readPages+=Number(f.get('pages'));checkAwards();save();render();toast('Páginas registradas.','success')});
    const rgf=$('#readGoalForm');if(rgf)submitForm(rgf,f=>{state.prefs.readGoal=Number(f.get('goal'));checkAwards();save();render();toast('Meta de leitura atualizada.','success')});
    const ref=$('#readEditForm');if(ref)submitForm(ref,f=>{dayData().readPages=Number(f.get('total'));checkAwards();save();render();toast('Total de páginas corrigido.','success')});
    const sf=$('#socialForm');if(sf)submitForm(sf,f=>{dayData().socialMin+=Number(f.get('minutes'));checkAwards();save();render();toast('Tempo registrado manualmente.','success')});
    const sgf=$('#socialGoalForm');if(sgf)submitForm(sgf,f=>{state.prefs.socialLimit=Number(f.get('limit'));checkAwards();save();render();toast('Seu limite diário foi atualizado.','success')});
    const sef=$('#socialEditForm');if(sef)submitForm(sef,f=>{dayData().socialMin=Number(f.get('total'));save();render();toast('Total de minutos corrigido.','success')});
    const trf=$('#transactionForm');if(trf)submitForm(trf,f=>{const record={description:f.get('description').trim(),type:f.get('type'),amount:Number(f.get('amount')),date:f.get('date')};if(editing?.type==='transaction'){const t=state.transactions.find(x=>x.id===editing.id);if(t)Object.assign(t,record)}else state.transactions.push({id:uid(),...record});editing=null;save();render();toast('Registro financeiro salvo.','success')});
    const cf=$('#chatForm');if(cf)submitForm(cf,f=>sendChat(String(f.get('message')).trim()));
  }
  function sendChat(text){if(!text)return;state.chat.push({role:'user',text,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});save();const danger=/me machucar|me ferir|tirar minha vida|me matar|suic[ií]d|quero morrer|estou em perigo|em perigo/i.test(text);state.chat.push({role:'assistant',text:responseFor(text),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});save();render();if(danger)toast('Procure agora um adulto de confiança e a emergência local.','warning')}
  $('#todayText').textContent=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
  render();checkAwards();save();
})();

</script>
</body>
</html>
